<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery with Grid</title>
<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: #f4f4f4;
color: #333;
text-align: center;
}
h1 {
margin: 20px 0;
}
.gallery {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
gap: 10px;
padding: 20px;
max-width: 1200px;
margin: 0 auto;
background-color: #fff;
border-radius: 8px;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
.gallery img {
width: 100%;
height: auto;
border-radius: 5px;
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.gallery img:hover {
transform: scale(1.1);
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}
@media (max-width: 600px) {
.gallery {
grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
}
}
</style>
</head>
<body>
<h1>Travel Blog Photo Gallery</h1>
<div class="gallery">
<img src="https://media.istockphoto.com/id/508628776/photo/sunset-over-kandariya-mahadeva-temple.jpg?s=612x612&w=0&k=20&c=YOpVZmLiY4ccl_aoWRJhfqLpNEDgjyOGuTAKbobCO-U=" alt="Destination 1">
<img src="https://media.istockphoto.com/id/614963888/photo/madurai-temple.jpg?s=612x612&w=0&k=20&c=DsQA3jxKCY-nPESfzGsrd1EZlM5fIs8Xu1WyXQOcfHU=" alt="Destination 2">
<img src="https://t3.ftcdn.net/jpg/04/69/85/20/360_F_469852099_bO6ycWJoQXUyqVj9So2Dnfx6gVqSQAKF.jpg" alt="Destination 3">
<img src="https://www.shutterstock.com/image-photo/beautiful-tirumala-tirupati-temple-gopuram-260nw-2396048435.jpg" alt="Destination 4">
</div>
</body>
</html>
